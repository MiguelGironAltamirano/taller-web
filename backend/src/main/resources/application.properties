spring.application.name=servicios
app.version=@project.version@

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=${APP_FLYWAY_LOCATIONS:classpath:db/migration}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.jwt.issuer=servicios-unmsm
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Passkeys (WebAuthn), docs/api/passkeys-v1.md §3: a passkey only works on the domain (rp-id) it was created for.
# The default origins are the local ones: nginx (8088), the E2E stack (8090) and the Vite dev server (5173).
app.auth.webauthn.rp-id=${APP_AUTH_WEBAUTHN_RP_ID:localhost}
app.auth.webauthn.rp-name=${APP_AUTH_WEBAUTHN_RP_NAME:Servicios Universitarios UNMSM}
app.auth.webauthn.allowed-origins=${APP_AUTH_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:8090,http://localhost:5173}
app.auth.webauthn.challenge-ttl=${APP_AUTH_WEBAUTHN_CHALLENGE_TTL:5m}

# The backend runs behind nginx (and Traefik in Dokploy): trust X-Forwarded-For only from private-network proxies.
server.forward-headers-strategy=native

# OpenAPI document and Swagger UI (OpenApiConfig). On in local and staging; set APP_API_DOCS_ENABLED=false in production.
springdoc.api-docs.enabled=${APP_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS_ENABLED:true}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
app.evidences.storage-path=${APP_EVIDENCES_STORAGE_PATH:./evidences}

# Reference load per technician shown by GET /dashboard/team.
app.dashboard.technician-capacity=${APP_DASHBOARD_TECHNICIAN_CAPACITY:8}

# Automatic closure of unconfirmed solutions (the period, autoCloseHours, is an administrator setting).
app.workflow.auto-close.enabled=${APP_WORKFLOW_AUTO_CLOSE_ENABLED:true}
app.workflow.auto-close.interval=${APP_WORKFLOW_AUTO_CLOSE_INTERVAL:PT15M}
app.workflow.auto-close.initial-delay=PT1M
app.workflow.auto-close.batch-size=100
