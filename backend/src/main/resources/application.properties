spring.application.name=servicios
app.version=@project.version@

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=${APP_FLYWAY_LOCATIONS:classpath:db/migration}

app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
app.jwt.issuer=servicios-unmsm
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
