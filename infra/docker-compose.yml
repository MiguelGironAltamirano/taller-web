services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e \"SELECT 1\" $$MYSQL_DATABASE"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_FLYWAY_LOCATIONS: ${APP_FLYWAY_LOCATIONS:-classpath:db/migration}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_EVIDENCES_STORAGE_PATH: ${APP_EVIDENCES_STORAGE_PATH:-/app/evidences}
      APP_WORKFLOW_AUTO_CLOSE_ENABLED: ${APP_WORKFLOW_AUTO_CLOSE_ENABLED:-true}
      APP_WORKFLOW_AUTO_CLOSE_INTERVAL: ${APP_WORKFLOW_AUTO_CLOSE_INTERVAL:-PT15M}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${APP_AUTH_REFRESH_COOKIE_SECURE:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - evidences_data:/app/evidences
    depends_on:
      mysql:
        condition: service_healthy
    # Health comes from the HEALTHCHECK in backend/Dockerfile (Actuator readiness probe).
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  mysql-data:
  evidences_data:
