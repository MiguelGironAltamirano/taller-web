server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver ${NGINX_RESOLVER} valid=10s;

  location /v3/api-docs {
    set $backend_upstream ${BACKEND_UPSTREAM};
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger-ui/ {
    set $backend_upstream ${BACKEND_UPSTREAM};
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /swagger-ui.html {
    set $backend_upstream ${BACKEND_UPSTREAM};
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    client_max_body_size 6m;
    set $backend_upstream ${BACKEND_UPSTREAM};
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Errors nginx itself produces (backend down or restarting, body too large) answer like the API does: problem
    # details in Spanish, never nginx's HTML page. Errors from the backend pass through untouched.
    error_page 502 503 504 = @api_unavailable;
    error_page 413 = @api_too_large;
  }

  location @api_unavailable {
    default_type "application/problem+json; charset=utf-8";
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"El servicio no está disponible en este momento. Inténtalo de nuevo en unos minutos"}';
  }

  location @api_too_large {
    default_type "application/problem+json; charset=utf-8";
    return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"El archivo supera el tamaño máximo permitido de 5 MB","errors":{"file":"El archivo supera el tamaño máximo permitido de 5 MB"}}';
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
